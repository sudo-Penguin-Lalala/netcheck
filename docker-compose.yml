services:
  netcheck:
    build:
      context: .
      dockerfile: Dockerfile
    image: nnt25/netcheck:latest
    container_name: netcheck
    restart: unless-stopped
    ports:
      - "7070:7070"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # environment:
    #   PORT: "7070"
    #   AUTH_TOKEN: "your-random-32-char-token-here"
    #   GLOBALPING_TOKEN: "your-globalping-token"
    #   TRUSTED_PROXIES: "127.0.0.1,172.16.0.0/12,10.0.0.0/8"
    #   ALLOW_PRIVATE_TARGETS: "0"
    #   ALLOWED_ORIGINS: ""
